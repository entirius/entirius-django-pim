[project]
name = "entirius-django-pim"
version = "3.2.0"
description = "PIM (Product Information Management) Django module for the Volkanos ecommerce platform"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "django-filter>=23.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "pydantic>=2.0",
    "drf-spectacular>=0.27",
    "django-admin-inline-paginator>=0.3.0",
    "python-slugify",
    "pytz",
    "pyyaml",
    "requests",
    "urllib3",
    "pillow>=9.1.0",
    "python-magic",
    "trafaret",
    "celery>=5.4",
    "opencv-contrib-python>=4.5",
    "entirius-py-bievents>=2.0.0",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-py-int-enum-choices>=2.0.0",
    "entirius-py-image-transformations>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
    "entirius-django-regional>=2.0.0",
    "entirius-django-utils>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "factory-boy", "dj-database-url", "psycopg[binary]"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-pim"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_pim"]

[tool.hatch.build.targets.wheel.force-include]
"src/django_pim/fixtures/pim-features-system.yaml" = "django_pim/fixtures/pim-features-system.yaml"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106", "B007", "F841"]
# Legacy migrated 1:1 — pre-existing lint debt, tracked outside this repo; do not grow these lists.
"src/django_pim/*.py" = ["F403", "F405", "S308", "UP031"]
"src/django_pim/api/admin/views/*" = ["C408"]
"src/django_pim/filters/*" = ["B904"]
"src/django_pim/management/commands/*" = ["B904"]
"src/django_pim/managers/*" = ["C414", "E722", "F403", "F811", "F821", "S101", "S321", "S324", "UP031"]
"src/django_pim/models/**" = ["B007", "C414", "DJ001", "DJ008", "DJ012", "E402", "E722", "E741", "F403", "F841", "S101", "S110", "S324", "UP031"]
"src/django_pim/repository/*" = ["B007", "F841", "S608", "UP031"]
"src/django_pim/services/*" = ["C416", "F841", "S324"]
"src/django_pim/utils/*" = ["B904", "S324", "UP031"]
"src/django_pim/views/api_viewer/*" = ["B023", "B904", "C408", "E731"]
"src/django_pim/workers/*" = ["C408"]

[tool.ruff.lint.isort]
known-first-party = ["django_pim"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test*.py", "*test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--reuse-db --create-db -m 'not slow'"
markers = [
    "slow: timing-sensitive performance benchmarks (deselected by default)",
]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# Legacy migrated 1:1: management commands import host-service apps (service_management, legacy `pim`)
# that exist only in a hosting deployment; the commands are inert without them.
DEP001 = ["service_management", "pim"]
